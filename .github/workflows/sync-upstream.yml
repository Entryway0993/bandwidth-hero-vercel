name: Sync upstream fork

on:
  schedule:
    - cron: "0 6 * * 1" # Runs every Monday at 6 AM UTC
  workflow_dispatch: # Allows you to click "Run workflow" manually

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream
        uses: tgymnich/fork-sync@v2
        with:
          owner: ayastreb
          repo: bandwidth-hero-proxy
          head: master # The upstream repo uses 'master'
          merge_method: merge
          pr_title: "Sync upstream changes"
          pr_message: "Automatic sync from upstream. Review carefully because this repo has custom security fixes. Resolve any conflicts in the GitHub UI."
          auto_merge: false